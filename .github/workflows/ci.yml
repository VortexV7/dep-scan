# Builds and tests DepScan itself (Stage 3).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
          cache: 'maven'
      - name: Test
        run: mvn -B test
      - name: Package
        run: mvn -B -q package -DskipTests
      - name: Smoke-test the fat jar on the sample project
        run: java -jar target/dep-scan-*.jar scan samples/vulnerable-app --offline --fail-on none || true
        # --offline needs a populated OSV cache; on a fresh runner there is
        # none, so this step is a smoke test only. The live scan is covered
        # by the sample workflow below, which runs online.
      - name: Upload fat jar
        uses: actions/upload-artifact@v4
        with:
          name: dep-scan-java${{ matrix.java }}
          path: target/dep-scan-*.jar
